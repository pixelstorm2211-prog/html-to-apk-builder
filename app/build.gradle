plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def generatedAppName = System.getenv("APK_APP_NAME") ?: "HTML приложение"

android {
    namespace 'com.pixelstorm.htmlviewer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pixelstorm.htmlviewer'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [appName: generatedAppName]
    }
}
