name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Название приложения"
        required: true
        default: "Моё HTML-приложение"
        type: string
      html_content:
        description: "Полный HTML-код страницы (до 65 000 символов)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare HTML and app label
        env:
          HTML_CONTENT: ${{ inputs.html_content }}
          APK_APP_NAME: ${{ inputs.app_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path("app/src/main/assets/index.html").write_text(
              os.environ["HTML_CONTENT"], encoding="utf-8"
          )
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: html-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
