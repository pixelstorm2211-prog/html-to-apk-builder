<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML → APK</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif;background:#10131b;color:#eef2ff}*{box-sizing:border-box}body{margin:0;padding:28px 16px;background:radial-gradient(ellipse at top,#202b45,#10131b 58%);min-height:100vh}main{max-width:1000px;margin:auto}.panel{background:#181e2b;border:1px solid #30394c;border-radius:18px;padding:22px;box-shadow:0 18px 60px #0005}h1{margin:0 0 8px;font-size:28px}p{color:#aab5ca;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}label{display:block;font-size:13px;color:#b8c4d9;margin:0 0 7px}input,textarea{width:100%;background:#0f1420;border:1px solid #354158;border-radius:10px;padding:12px;color:#f4f7ff;font:14px inherit}textarea{min-height:360px;resize:vertical;font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}button{border:0;border-radius:10px;padding:13px 20px;background:#6b8cff;color:white;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.muted{font-size:12px;color:#8996ad}.status{margin-top:16px;padding:12px;border-radius:10px;background:#111827;white-space:pre-wrap;min-height:44px}.preview{width:100%;height:300px;border:1px solid #354158;border-radius:10px;background:white;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}body{padding:14px 10px}.panel{padding:16px}}
</style></head><body><main><section class="panel">
<h1>HTML → Android APK</h1><p>Вставь HTML-код, задай название приложения и нажми одну кнопку. Сборка выполняется в GitHub Actions; готовый APK можно будет скачать здесь.</p>
<div class="grid"><div><label for="appName">Название приложения</label><input id="appName" maxlength="40" value="Моё HTML-приложение"></div><div><label for="workerUrl">Адрес облачного API (настраивается один раз)</label><input id="workerUrl" placeholder="https://your-worker.your-subdomain.workers.dev"></div></div>
<label for="html">HTML-код</label><textarea id="html" spellcheck="false" placeholder="<!doctype html> ..."></textarea><p class="muted">Лимит HTML: 55 000 символов. JavaScript работает внутри Android WebView. Внешние ресурсы требуют интернет.</p>
<button id="build">СОЗДАТЬ APK</button><div id="status" class="status" aria-live="polite">Готово к сборке.</div><iframe class="preview" id="preview" sandbox="allow-same-origin" title="Предпросмотр"></iframe>
</section></main><script>
const $=id=>document.getElementById(id),say=s=>$('status').textContent=s;
$('html').addEventListener('input',()=>$('preview').srcdoc=$('html').value);
$('build').addEventListener('click',async()=>{const html=$('html').value,appName=$('appName').value.trim(),base=$('workerUrl').value.trim().replace(/\/$/,'');if(!base)return say('Сначала укажи URL Cloudflare Worker из инструкции в README.');if(!html.trim())return say('Вставь HTML-код.');if(html.length>55000)return say('HTML слишком большой. Максимум 55 000 символов.');if(!appName)return say('Укажи название приложения.');$('build').disabled=true;say('Отправляю HTML на облачную сборку…');try{const r=await fetch(base+'/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({html,appName})});const data=await r.json();if(!r.ok)throw Error(data.error||'Ошибка запуска');say('Сборка запущена…');const start=Date.now();while(Date.now()-start<720000){await new Promise(ok=>setTimeout(ok,7000));const q=await fetch(base+'/status?build_id='+encodeURIComponent(data.build_id));const s=await q.json();if(!q.ok)throw Error(s.error||'Не удалось проверить статус');if(s.status==='completed'&&s.artifact_id){say('APK готов! Загружаю…');const d=await fetch(base+'/download?artifact_id='+encodeURIComponent(s.artifact_id));if(!d.ok)throw Error('Не удалось скачать APK');const blob=await d.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='html-android-apk.zip';a.click();URL.revokeObjectURL(u);say('Готово! Распакуй ZIP — внутри будет app-debug.apk.');return}if(['failure','cancelled','timed_out'].includes(s.status))throw Error('Сборка завершилась: '+s.status+'. '+(s.run_url||''));say('Сборка выполняется… '+(s.status||'ожидание'))}throw Error('Сборка ещё выполняется. Проверь вкладку Actions в GitHub.')}catch(e){say('Ошибка: '+e.message)}finally{$('build').disabled=false}});
</script></body></html>
